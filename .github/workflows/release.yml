name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm (M1 and above)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm ci

      - name: run core tests (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test -p clip2pod-core -p clip2pod-rip --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clip2Pod ${{ github.ref_name }}'
          releaseBody: |
            Turn an article — or a video's audio — into a podcast episode. See the assets below for your platform.

            **Rip mode** needs `yt-dlp` and `ffmpeg` on your PATH (not bundled). Narrate mode has no extra dependencies.

            Companion browser extension (Chrome + Firefox) installs from the repo's `extension/` folder — see [extension/README.md](https://github.com/FlocktimusPrime/Clip2Pod/blob/main/extension/README.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
