name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm (M1 and above)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libasound2-dev is not Clip2Pod's: the vendored msedge-tts declares
          # rodio as a dev-dependency for its doctests, which pulls alsa-sys,
          # whose build script needs alsa.pc present before `cargo test` on
          # that crate will even compile.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: install frontend dependencies
        run: npm ci

      - name: run core tests (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo test -p clip2pod-core -p clip2pod-rip --manifest-path src-tauri/Cargo.toml
          cargo test -p msedge-tts --lib --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clip2Pod ${{ github.ref_name }}'
          releaseBody: |
            Turn an article — or a video's audio — into a podcast episode. See the assets below for your platform.

            **Rip mode** needs `yt-dlp` and `ffmpeg` on your PATH (not bundled). Narrate mode has no extra dependencies.

            Companion browser extension (Chrome + Firefox) installs from the repo's `extension/` folder — see [extension/README.md](https://github.com/FlocktimusPrime/Clip2Pod/blob/main/extension/README.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
