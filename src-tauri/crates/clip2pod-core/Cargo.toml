[package]
name = "clip2pod-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Clip2Pod application logic: text cleaning, junk matching, voice cycling, queue, naming, tagging, config"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
id3 = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
msedge-tts = "0.2"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
dom_smoothie = "0.12"
thiserror = "2"
mp3-duration = "0.1"

[dev-dependencies]
tempfile = "3"
