<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send to Clip2Pod options</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; }
      label { display: block; margin-bottom: 12px; }
      #cap { width: 5em; margin-left: 0.5em; }
      #token { width: 24em; margin-left: 0.5em; font-family: ui-monospace, monospace; }
      p { margin: -6px 0 12px; opacity: 0.75; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <label>
      Pairing code
      <input type="text" id="token" spellcheck="false" autocomplete="off" />
    </label>
    <p>Copy it from Clip2Pod → Settings → Browser extension.</p>
    <label>
      Top-level comments per Reddit thread
      <input type="number" id="cap" min="1" max="500" />
    </label>
    <script src="options.js"></script>
  </body>
</html>
