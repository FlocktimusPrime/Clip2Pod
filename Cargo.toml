[package]
name = "ytdlfeed-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "yt-dlFeed application logic: config, queue, yt-dlp invocation, podcast feed"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
id3 = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
shell-words = "1"
mp3-duration = "0.1"

[dev-dependencies]
tempfile = "3"
